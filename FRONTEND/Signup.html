    <div class="main-login">
          <form action="/query">

             <i class="fa-solid fa-lock"></i> Confirm Password: <input type="password" name="password" id="login" placeholder="Re-enter your password"><br/>
            <i class="fa-solid fa-building-columns"></i> University: <input type="text" name="email" id="login" placeholder="Enter your University name"><br/>

            <h4>Already have an account? <a class="SignUp" href="Login.html">Login</a></h4>
